<section
  class="appz-solution-hero"
  data-solution-hero
  [attr.aria-labelledby]="config.headingId">
  <div class="appz-solution-hero__inner">
    <div class="appz-solution-hero__visual">
      <a
        class="appz-solution-hero__visual-link"
        [attr.href]="'#' + config.scrollTargetId"
        [attr.aria-label]="config.scrollLabel"
        (click)="scrollToTarget($event)">
        <img
          [src]="config.imageSrc"
          [alt]="config.imageAlt"
          [width]="config.imageWidth"
          [height]="config.imageHeight"
          loading="eager"
          fetchpriority="high">
      </a>
    </div>
    <div class="appz-solution-hero__copy">
      <h1 [id]="config.headingId">{{ config.title }}</h1>
    </div>
  </div>
</section>
