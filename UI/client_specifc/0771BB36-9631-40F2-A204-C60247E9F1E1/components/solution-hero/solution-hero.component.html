<section
  class="appz-solution-hero"
  data-solution-hero
  [attr.aria-labelledby]="config.headingId">
  <div class="appz-solution-hero__inner">
    <div class="appz-solution-hero__visual">
      <a
        class="appz-solution-hero__visual-link"
        [attr.href]="'#' + config.scrollTargetId"
        [attr.aria-label]="config.scrollLabel"
        (click)="scrollToTarget($event)">
        <img
          [src]="config.imageSrc"
          [alt]="config.imageAlt"
          [width]="config.imageWidth"
          [height]="config.imageHeight"
          loading="eager"
          fetchpriority="high">
      </a>
      <a
        class="appz-solution-hero__integration-link"
        [attr.href]="'#' + config.integrationTargetId"
        [attr.aria-label]="config.integrationLabel"
        (click)="scrollToIntegration($event)">
        <span class="appz-solution-hero__screen" aria-hidden="true">
          <span class="appz-solution-hero__screen-bar">
            <i></i><i></i><i></i>
          </span>
          <span class="appz-solution-hero__screen-body">
            <i></i><i></i><i></i>
          </span>
        </span>
      </a>
      <a
        *ngFor="let device of config.deviceLinks"
        class="appz-solution-hero__device-link"
        [attr.data-solution-device]="device.id"
        [attr.href]="'#' + device.targetId"
        [attr.aria-label]="device.label"
        (click)="scrollToDevice($event, device)">
      </a>
    </div>
    <div class="appz-solution-hero__copy">
      <h1 [id]="config.headingId">{{ config.title }}</h1>
    </div>
  </div>
</section>
