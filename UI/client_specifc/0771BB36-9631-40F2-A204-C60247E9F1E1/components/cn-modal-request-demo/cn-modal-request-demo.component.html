<div id="webview">
    <div mat-dialog-title>
        <h2 style="padding: 35px 35px 0 35px; margin-bottom:0px">Request For Demo</h2>
    </div>
    <div mat-dialog-content>
        <form [formGroup]="requestDemoForm" (ngSubmit)="onSubmit()" >
            <div class="overflow-hidden h-100" style="padding:35px">
                <div class="alert alert-success" *ngIf="showSuccessMsg">
                    {{successMsg}}
                </div>
                <div class="alert alert-danger" *ngIf="showErrorMsg">
                    {{errorMsg}}
                </div>
                <div class="col-12 form-group">
                    <label for="name">名字</label> 
                    <input type="text" id="name" value="" formControlName="name"  [ngClass]="{ 'is-invalid': submitted && objData['name'].errors }"  class="form-control">
                    <div *ngIf="submitted && objData['name'].errors" class="invalid-feedback">
                        <div *ngIf="objData['name'].errors['required']">名字为必填项!</div>
                        <div *ngIf="objData['name'].errors['pattern']">不合规名字!</div>
                    </div>
                </div>
                <div class="col-12 form-group">
                    <label for="email">电子邮件地址</label>
                    <input type="email" id="email" value="" formControlName="email" [ngClass]="{ 'is-invalid': submitted && objData['email'].errors }" class="form-control">
                    <div *ngIf="submitted && objData['email'].errors" class="invalid-feedback">
                        <div *ngIf="objData['email'].errors['required']">电子邮件地址为必填项!</div>
                        <div *ngIf="objData['email'].errors['email']">不合规电子邮件地址!</div>
                    </div>
                </div>
                <div class="col-12 form-group">
                    <label for="mobilenum">电话号码</label>
                    <input type="text" id="mobilenum" value="" formControlName="mobilenum" [ngClass]="{ 'is-invalid': submitted && objData['mobilenum'].errors }" class="form-control">
                    <div *ngIf="submitted && objData['mobilenum'].errors" class="invalid-feedback">
                        <div *ngIf="objData['mobilenum'].errors['required']">电话号码为必填项!</div>
                        <div *ngIf="objData['mobilenum'].errors['pattern']">不合规电话号码!</div>
                    </div>
                </div>
                <div class="col-12 form-group">
                    <label for="restaurant_name">公司名字</label>
                    <input type="text" id="restaurant_name" formControlName="restaurant_name" [ngClass]="{ 'is-invalid': submitted && objData['restaurant_name'].errors }" value="" class="form-control">
                    <div *ngIf="submitted && objData['restaurant_name'].errors" class="invalid-feedback">
                        <div *ngIf="objData['restaurant_name'].errors['required']">公司名字为必填项!</div>
                        <div *ngIf="objData['restaurant_name'].errors['pattern']">不合规公司名字!</div>
                    </div>
                </div>
                <div class="col-12 form-group">
                    <input type="submit" class="button button-large button-circle"  value="Submit" />
                    <button type="button" class="button button2 button-large button-light button-circle" style="color:black;" mat-button (click)="onNoClick()">Cancel</button>
                </div>
            </div>
        </form>
    </div>
</div>
