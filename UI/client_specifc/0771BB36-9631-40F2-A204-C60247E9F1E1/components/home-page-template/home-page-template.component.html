<div class="appz-home-template" data-home-page-template [attr.lang]="config.language">
  <app-home-hero [config]="config.hero" (requestDemo)="requestDemo.emit()"></app-home-hero>

  <app-home-order-flow *ngIf="config.solutions as solutions" [config]="solutions"></app-home-order-flow>

  <main class="appz-page appz-home-story">
    <app-home-story-sections *ngIf="config.storySections?.length" [sections]="config.storySections!" (requestDemo)="requestDemo.emit()"></app-home-story-sections>

    <ng-container *ngIf="config.layout === 'english-landing'; else defaultHomepageSections">
      <app-home-ecosystem *ngIf="config.hardware as hardware" [hardware]="hardware"></app-home-ecosystem>
      <app-home-ecosystem *ngIf="config.growth as growth" [growth]="growth"></app-home-ecosystem>
      <app-home-ecosystem *ngIf="config.grant as grant" [grant]="grant"></app-home-ecosystem>
      <app-home-industries *ngIf="config.industries as industries" [config]="industries"></app-home-industries>
      <app-home-ecosystem *ngIf="config.features as features" [features]="features"></app-home-ecosystem>
      <ng-container *ngIf="config.proof as proof">
        <app-home-proof [config]="proof" mode="customers"></app-home-proof>
        <app-home-proof [config]="proof" mode="reviews"></app-home-proof>
      </ng-container>
    </ng-container>

    <ng-template #defaultHomepageSections>
      <app-home-ecosystem *ngIf="config.hardware || config.growth || config.grant || config.features"
        [hardware]="config.hardware" [growth]="config.growth" [grant]="config.grant" [features]="config.features"></app-home-ecosystem>
      <app-home-industries *ngIf="config.industries as industries" [config]="industries"></app-home-industries>
      <app-home-proof *ngIf="config.proof as proof" [config]="proof"></app-home-proof>
    </ng-template>

    <section *ngIf="config.conversion" class="appz-conversion-panel" data-home-section="form" [id]="config.conversion.sectionId">
      <app-custom-request-demo [locale]="config.conversion.locale"></app-custom-request-demo>
    </section>
  </main>

  <nav *ngIf="config.floatingContacts?.length" class="appz-home-floating-contacts" aria-label="Contact APPZPOS">
    <a *ngFor="let contact of config.floatingContacts" [href]="contact.href"
      [target]="contact.target || '_self'" [rel]="contact.rel || null">
      <img [src]="contact.image" [alt]="contact.imageAlt" width="64" height="64" loading="lazy">
    </a>
  </nav>
</div>
