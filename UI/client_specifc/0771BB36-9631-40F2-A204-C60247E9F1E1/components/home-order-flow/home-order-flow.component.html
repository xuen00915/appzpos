<section #ecosystemSection
         class="appz-ecosystem"
         data-home-section="island"
         [class.is-visible]="isVisible"
         [class.has-active-island]="activeIslandId"
         aria-labelledby="appz-ecosystem-title">


    <header class="appz-ecosystem__heading">
        <p *ngIf="config.eyebrow" class="appz-ecosystem__eyebrow">{{ config.eyebrow }}</p>
        <h2 id="appz-ecosystem-title" class="appz-section-title">{{ config.title }}</h2>
        <p *ngIf="config.description" class="appz-ecosystem__intro appz-section-description">{{ config.description }}</p>
    </header>

    <div class="appz-ecosystem__layout appz-ecosystem__window" data-ecosystem-layout>
        <nav class="appz-ecosystem__options" aria-label="Choose an APPZPOS solution">
          <button *ngFor="let island of islands" type="button"
            class="appz-ecosystem__option"
            [class.is-active]="activeIslandId === island.id || activeDetailsIslandId === island.id"
            [attr.data-route]="island.route" [attr.data-island-id]="island.id"
            [attr.aria-pressed]="activeDetailsIslandId === island.id"
            aria-controls="appz-island-details" data-ecosystem-island
            (click)="openIslandDetails($event, island.id)"
            (keydown.enter)="handleOptionKey($event, island.id)"
            (keydown.space)="handleOptionKey($event, island.id)">
            <span *ngFor="let module of island.modules" data-island-module><strong>{{ module.title }}</strong></span>
          </button>
        </nav>

        <div class="appz-ecosystem__copy">
          <div class="appz-ecosystem__selected-visual" *ngIf="activeDetailsIsland as selected">
            <img [src]="selected.image" [alt]="selected.imageAlt" width="1536" height="1024" decoding="async">
          </div>

        <section *ngIf="activeDetailsIsland as detailsIsland"
                 id="appz-island-details"
                 class="appz-ecosystem__details"
                 [ngClass]="'appz-ecosystem__details--' + detailsIsland.id"
                 data-island-details
                 aria-live="polite"
                 [attr.aria-labelledby]="'appz-island-details-title-' + detailsIsland.id">
            <header class="appz-ecosystem__details-header">
                <div>
                    <p>{{ detailsIsland.title }}</p>
                    <h2 [id]="'appz-island-details-title-' + detailsIsland.id">{{ activeDetailsModules[0]?.title }}</h2>
                </div>
            </header>

            <div class="appz-ecosystem__details-body"
                 [class.appz-ecosystem__details-body--multiple]="activeDetailsModules.length > 1">
                <article *ngFor="let module of activeDetailsModules" class="appz-ecosystem__details-module">
                    <ul>
                        <li *ngFor="let feature of module.features" data-details-feature>
                            <i aria-hidden="true"></i>
                            <p><strong>{{ feature.label }}</strong><span> - {{ feature.description }}</span></p>
                        </li>
                    </ul>
                    <a class="appz-ecosystem__details-learn-more"
                       data-details-learn-more
                       [routerLink]="module.route">{{ config.learnMoreLabel }}</a>
                </article>
            </div>
        </section>
        </div>
    </div>

</section>
