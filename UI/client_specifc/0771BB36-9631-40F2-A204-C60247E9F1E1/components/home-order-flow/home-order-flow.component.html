<section #ecosystemSection
         class="appz-ecosystem"
         [class.is-visible]="isVisible"
         [class.has-active-island]="activeIslandId"
         aria-labelledby="appz-ecosystem-title">
    <header class="appz-ecosystem__heading">
        <p class="appz-ecosystem__eyebrow">CONNECTED APPZPOS ECOSYSTEM</p>
        <h2 id="appz-ecosystem-title">Everything Works Together</h2>
        <p class="appz-ecosystem__intro">
            From order to kitchen, pickup, delivery and management — connect the APPZPOS modules that fit your business.
        </p>
    </header>

    <div #ecosystemStage
         class="appz-ecosystem__stage"
         (pointermove)="handlePointerMove($event)"
         (pointerleave)="resetPointerParallax()">
        <svg class="appz-ecosystem__connections"
             viewBox="0 0 1400 1040"
             preserveAspectRatio="none"
             aria-hidden="true">
            <defs>
                <filter id="appz-ecosystem-signal-glow" x="-200%" y="-200%" width="500%" height="500%">
                    <feGaussianBlur stdDeviation="5" result="blur" />
                    <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
                </filter>
            </defs>

            <g data-ecosystem-connection="admin"
               class="appz-ecosystem__connection"
               [class.is-active]="activeIslandId === 'admin'">
                <path class="appz-ecosystem__bridge" d="M720 500C828 424 1012 293 1120 230" />
                <path class="appz-ecosystem__route" pathLength="1" d="M720 500C828 424 1012 293 1120 230" />
                <circle class="appz-ecosystem__endpoint" cx="1120" cy="230" r="5" />
                <circle class="appz-ecosystem__signal" r="6">
                    <animateMotion dur="1.9s" repeatCount="indefinite" path="M1120 230C1012 293 828 424 720 500" />
                </circle>
            </g>
            <g data-ecosystem-connection="kitchen"
               class="appz-ecosystem__connection appz-ecosystem__connection--orange"
               [class.is-active]="activeIslandId === 'kitchen'">
                <path class="appz-ecosystem__bridge" d="M692 482C674 380 636 254 610 168" />
                <path class="appz-ecosystem__route" pathLength="1" d="M692 482C674 380 636 254 610 168" />
                <circle class="appz-ecosystem__endpoint" cx="610" cy="168" r="5" />
                <circle class="appz-ecosystem__signal" r="6">
                    <animateMotion dur="1.8s" repeatCount="indefinite" path="M610 168C636 254 674 380 692 482" />
                </circle>
            </g>
            <g data-ecosystem-connection="dining"
               class="appz-ecosystem__connection"
               [class.is-active]="activeIslandId === 'dining'">
                <path class="appz-ecosystem__bridge" d="M674 512C542 468 410 411 282 368" />
                <path class="appz-ecosystem__route" pathLength="1" d="M674 512C542 468 410 411 282 368" />
                <circle class="appz-ecosystem__endpoint" cx="282" cy="368" r="5" />
                <circle class="appz-ecosystem__signal" r="6">
                    <animateMotion dur="1.7s" repeatCount="indefinite" path="M282 368C410 411 542 468 674 512" />
                </circle>
            </g>
            <g data-ecosystem-connection="pos"
               class="appz-ecosystem__connection"
               [class.is-active]="activeIslandId === 'pos'">
                <path class="appz-ecosystem__bridge" d="M732 526C844 513 956 485 1086 450" />
                <path class="appz-ecosystem__route" pathLength="1" d="M732 526C844 513 956 485 1086 450" />
                <circle class="appz-ecosystem__endpoint" cx="1086" cy="450" r="5" />
                <circle class="appz-ecosystem__signal" r="6">
                    <animateMotion dur="1.65s" repeatCount="indefinite" path="M1086 450C956 485 844 513 732 526" />
                </circle>
            </g>
            <g data-ecosystem-connection="website"
               class="appz-ecosystem__connection"
               [class.is-active]="activeIslandId === 'website'">
                <path class="appz-ecosystem__bridge" d="M686 548C576 636 460 735 338 817" />
                <path class="appz-ecosystem__route" pathLength="1" d="M686 548C576 636 460 735 338 817" />
                <circle class="appz-ecosystem__endpoint" cx="338" cy="817" r="5" />
                <circle class="appz-ecosystem__signal" r="6">
                    <animateMotion dur="1.75s" repeatCount="indefinite" path="M338 817C460 735 576 636 686 548" />
                </circle>
            </g>
            <g data-ecosystem-connection="delivery"
               class="appz-ecosystem__connection appz-ecosystem__connection--orange"
               [class.is-active]="activeIslandId === 'delivery'">
                <path class="appz-ecosystem__bridge" d="M712 554C740 654 784 761 824 850" />
                <path class="appz-ecosystem__route" pathLength="1" d="M712 554C740 654 784 761 824 850" />
                <circle class="appz-ecosystem__endpoint" cx="824" cy="850" r="5" />
                <circle class="appz-ecosystem__signal" r="6">
                    <animateMotion dur="1.85s" repeatCount="indefinite" path="M824 850C784 761 740 654 712 554" />
                </circle>
            </g>
        </svg>

        <div class="appz-ecosystem__hub" data-ecosystem-hub aria-hidden="true">
            <span class="appz-ecosystem__hub-glow"></span>
            <img src="assets/images/ecosystem/ecosystem-hub.webp"
                 alt=""
                 width="1536"
                 height="1024"
                 loading="lazy"
                 decoding="async" />
        </div>

        <a *ngFor="let island of islands; let index = index"
           class="appz-ecosystem__island"
           [ngClass]="[
               'appz-ecosystem__island--' + island.id,
               island.id === 'pos' || island.id === 'website' || island.id === 'delivery'
                   ? 'appz-ecosystem__island--lower'
                   : ''
           ]"
           [class.is-active]="activeIslandId === island.id"
           [class.is-muted]="!!activeIslandId && activeIslandId !== island.id"
           [routerLink]="island.route"
           [attr.data-island-id]="island.id"
           [attr.data-depth]="island.depth"
           [attr.aria-label]="island.ariaLabel"
           data-ecosystem-island
           (pointerenter)="setActiveIsland(island.id)"
           (pointerleave)="clearActiveIsland()"
           (focus)="setActiveIsland(island.id)"
           (blur)="clearActiveIsland()">
            <span class="appz-ecosystem__island-float">
                <img [src]="island.image"
                     alt=""
                     width="1536"
                     height="1024"
                     loading="lazy"
                     decoding="async" />
            </span>
            <span class="appz-ecosystem__label">
                <i aria-hidden="true"></i>
                <strong>{{ island.title }}</strong>
                <small>{{ island.detail }}</small>
            </span>
        </a>
    </div>

    <div class="appz-ecosystem__modules">
        <nav class="appz-ecosystem__module-tabs"
             role="tablist"
             aria-label="Explore APPZPOS modules"
             (keydown)="handleModuleKeys($event)">
            <button *ngFor="let module of productModules; let index = index"
                    type="button"
                    role="tab"
                    data-module-tab
                    [id]="'appz-module-tab-' + module.id"
                    [class.is-active]="activeModuleIndex === index"
                    [attr.aria-selected]="activeModuleIndex === index"
                    [attr.aria-controls]="'appz-module-panel-' + module.id"
                    [attr.tabindex]="activeModuleIndex === index ? 0 : -1"
                    (click)="selectModule(index)">
                {{ module.title }}
            </button>
        </nav>

        <div class="appz-ecosystem__module-panels">
            <article *ngFor="let module of productModules; let index = index"
                     class="appz-ecosystem__module-panel"
                     data-module-panel
                     [attr.data-module-panel]="module.id"
                     [class.is-active]="activeModuleIndex === index"
                     [id]="'appz-module-panel-' + module.id"
                     role="tabpanel"
                     [attr.aria-labelledby]="'appz-module-tab-' + module.id"
                     [hidden]="activeModuleIndex !== index">
                <figure class="appz-ecosystem__module-media">
                    <img [src]="moduleImageUrl(module.image)"
                         [alt]="module.title"
                         width="900"
                         height="700"
                         loading="lazy"
                         decoding="async" />
                </figure>

                <div class="appz-ecosystem__module-copy">
                    <h3>{{ module.title }}</h3>
                    <ul>
                        <li *ngFor="let feature of module.features" data-module-feature>
                            <i aria-hidden="true"></i>
                            <p><strong>{{ feature.label }}</strong><span> - {{ feature.description }}</span></p>
                        </li>
                    </ul>
                    <a class="appz-ecosystem__learn-more" [routerLink]="module.route">Learn More</a>
                </div>
            </article>
        </div>
    </div>
</section>
