<section #ecosystemSection
         class="appz-ecosystem"
         [class.is-visible]="isVisible"
         [class.has-active-island]="activeIslandId"
         aria-labelledby="appz-ecosystem-title">
    <header class="appz-ecosystem__heading">
        <p class="appz-ecosystem__eyebrow">CONNECTED APPZPOS ECOSYSTEM</p>
        <h2 id="appz-ecosystem-title">Everything Works Together</h2>
        <p class="appz-ecosystem__intro">
            From order to kitchen, pickup, delivery and management — connect the APPZPOS modules that fit your business.
        </p>
    </header>

    <div #ecosystemStage
         class="appz-ecosystem__stage"
         (pointermove)="handlePointerMove($event)"
         (pointerleave)="resetPointerParallax()">
        <svg class="appz-ecosystem__connections"
             viewBox="0 0 1400 800"
             preserveAspectRatio="none"
             aria-hidden="true">
            <defs>
                <filter id="appz-ecosystem-signal-glow" x="-200%" y="-200%" width="500%" height="500%">
                    <feGaussianBlur stdDeviation="5" result="blur" />
                    <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
                </filter>
            </defs>

            <g data-ecosystem-connection="admin"
               class="appz-ecosystem__connection"
               [class.is-active]="activeIslandId === 'admin'">
                <path d="M690 398C570 330 470 236 326 172" />
                <circle class="appz-ecosystem__endpoint" cx="326" cy="172" r="5" />
                <circle class="appz-ecosystem__signal" r="6">
                    <animateMotion dur="1.9s" repeatCount="indefinite" path="M326 172C470 236 570 330 690 398" />
                </circle>
            </g>
            <g data-ecosystem-connection="kitchen"
               class="appz-ecosystem__connection"
               [class.is-active]="activeIslandId === 'kitchen'">
                <path d="M710 395C840 307 944 216 1084 158" />
                <circle class="appz-ecosystem__endpoint" cx="1084" cy="158" r="5" />
                <circle class="appz-ecosystem__signal" r="6">
                    <animateMotion dur="1.8s" repeatCount="indefinite" path="M1084 158C944 216 840 307 710 395" />
                </circle>
            </g>
            <g data-ecosystem-connection="pos"
               class="appz-ecosystem__connection"
               [class.is-active]="activeIslandId === 'pos'">
                <path d="M684 417C544 456 438 535 292 604" />
                <circle class="appz-ecosystem__endpoint" cx="292" cy="604" r="5" />
                <circle class="appz-ecosystem__signal" r="6">
                    <animateMotion dur="1.65s" repeatCount="indefinite" path="M292 604C438 535 544 456 684 417" />
                </circle>
            </g>
            <g data-ecosystem-connection="website"
               class="appz-ecosystem__connection"
               [class.is-active]="activeIslandId === 'website'">
                <path d="M716 418C848 465 966 535 1108 578" />
                <circle class="appz-ecosystem__endpoint" cx="1108" cy="578" r="5" />
                <circle class="appz-ecosystem__signal" r="6">
                    <animateMotion dur="1.75s" repeatCount="indefinite" path="M1108 578C966 535 848 465 716 418" />
                </circle>
            </g>
            <g data-ecosystem-connection="delivery"
               class="appz-ecosystem__connection"
               [class.is-active]="activeIslandId === 'delivery'">
                <path d="M702 426C704 515 711 617 722 706" />
                <circle class="appz-ecosystem__endpoint" cx="722" cy="706" r="5" />
                <circle class="appz-ecosystem__signal" r="6">
                    <animateMotion dur="1.85s" repeatCount="indefinite" path="M722 706C711 617 704 515 702 426" />
                </circle>
            </g>
        </svg>

        <a *ngFor="let island of islands; let index = index"
           class="appz-ecosystem__island"
           [ngClass]="[
               'appz-ecosystem__island--' + island.id,
               island.id === 'pos' || island.id === 'website' || island.id === 'delivery'
                   ? 'appz-ecosystem__island--lower'
                   : ''
           ]"
           [class.is-active]="activeIslandId === island.id"
           [class.is-muted]="!!activeIslandId && activeIslandId !== island.id"
           [routerLink]="island.route"
           [attr.data-island-id]="island.id"
           [attr.data-depth]="island.depth"
           [attr.aria-label]="island.ariaLabel"
           data-ecosystem-island
           (pointerenter)="setActiveIsland(island.id)"
           (pointerleave)="clearActiveIsland()"
           (focus)="setActiveIsland(island.id)"
           (blur)="clearActiveIsland()">
            <span class="appz-ecosystem__island-float">
                <img [src]="island.image"
                     alt=""
                     width="1536"
                     height="1024"
                     loading="lazy"
                     decoding="async" />
            </span>
            <span class="appz-ecosystem__label">
                <i aria-hidden="true"></i>
                <strong>{{ island.title }}</strong>
                <small>{{ island.detail }}</small>
            </span>
        </a>
    </div>
</section>
